[project]
name = "omdomme-worker"
version = "0.1.0"
description = "Collects mentions of registered profiles and stores them in Supabase."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-socket>=0.7",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omdomme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must never reach a real API. Only the local test Postgres is allowed.
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1,localhost"
markers = ["db: needs the local test Postgres (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
